<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* 最新消息區 */
        #news {
            width: 280px;
            height: 460px;
            border: 1px solid #999;
            float: left;
        }

        #news h1 {
            text-align: left;
            font-weight: bolder;
            font-size: 16px;
        }

        #news th {
            background: #3399ff;
            font-size: 14px;
            color: white;
        }

        .odd {
            font-size: 12px;
            line-height: 2;
            background: #ffffcc;
        }

        .even {

            font-size: 12px;
            line-height: 2;
            background: #DDDDDD;
        }

        /* 圖片展示區 */
        #photos {
            width: 590px;
            height: 460px;
            border: 1px solid #999;
            float: right;
            background: #333;
            color: #ff0;
            font-size: 14px;
            text-align: center;
        }

        /* 寫程式所以取名id ， 會比較好抓取 */
        #big {
            /* 寬 、高 要自己記 ，紙本沒跟我們說尺寸 */
            width: 570px;
            height: 340px;

        }
    </style>
</head>

<body>
    <div id="news">
        <h1>最新消息</h1>
        <!-- table>tr*5>td*2 -->
        <table>
            <tr>
                <!-- 改為 th ，會自帶水平置中，且在選取樣式時比較方便-->
                <th>主題</th>
                <th>發布日期</th>
            </tr>
            <tr class="odd">
                <td><img src="../images/0201.png">公告全國技能競賽相關事宜</td>
                <td align="center">115/11/27</td>
            </tr>
            <tr class="even">
                <td><img src="../images/0201.png">公告即測即評及發證相關事宜</td>
                <td align="center">115/11/27</td>
            </tr>
            <tr class="odd">
                <td><img src="../images/0201.png">公告網頁設計修題相關事宜</td>
                <td align="center">115/11/27</td>
            </tr>
            <tr class="even">
                <td><img src="../images/0201.png">公告網路架設應檢相關事宜</td>
                <td align="center">115/11/27</td>
            </tr>
        </table>
    </div>
    <div id="photos">
        <!-- table>tr*3>td*4 -->
        <table>
            <tr>
                <td colspan="4">
                    <img id="big" src="../images/0202A.png">
                </td>
            </tr>
            <tr>
                <td><img class="small" src="../images/0202B.png"></td>
                <td><img class="small" src="../images/0203B.png"></td>
                <td><img class="small" src="../images/0204B.png"></td>
                <td><img class="small" src="../images/0205B.png"></td>
            </tr>
            <tr>
                <td>第30屆倫敦奧運</td>
                <td>許淑淨奪舉重銀牌</td>
                <td>第26屆深圳世大運</td>
                <td>第27屆喀山世大運</td>
            </tr>
        </table>
    </div>
    <!-- 引入jquery 函式庫 ， 就可以用jq的語法 -->
    <script src="../ohters/jquery-2.1.4.min.js"></script>
    <script>
        // jquery
        // $()=>起手式，一個叫$()的函式
        // $()裡面可以放css選擇器，會回傳一個物件。裡面有所有符合的元素
        // 任務:點擊小圖，換大圖
        // 1.先抓到所有小圖，並進行each()的迴圈逐一拜訪
        // $('.small').each(function (index, img) {
            // index 當下小圖的索引值，從0開始 ，img 當下小圖的元素
            // console.log(index,img)
            // 2.替每張小圖加上點擊事件，注意img是沒有''單引，""雙引號
            // $(img).on('click', function () {
                // attr是attribute縮寫
                // index 是 0、1、2、3
                // 那怎麼將檔名變成2、3、4、5呢?
        //         $('#big').attr('src', `../images/020${index + 2}A.png`)
        //     })

        // })

        // 另一種作法
        // $('.small').click(function () {
            // 一個參數叫取值 src
            // this 是當下小圖的元素
            // 取得當下小圖的src屬性值，並存到small_pic 變數
            // 例如:../images/0202B.png
            // let small_pic = $(this).attr('src')
            // 將small_pic的B改成A，存到big_pic變數
            // 例如:../images/0202B.png =>../images/0202A.pmg
            // let big_pic = small_pic.replace('B', 'A')

            // 兩個參數叫設定值
            // 最後再將big_pic設定給大圖的src屬性
        //     $('#big').attr('src', big_pic)
        // })
        // 物件會有自己的屬性與方法
        // 例如字串的屬性是length、方法是replace()...
        // 陣列也是一種物件，屬性是length、方法是push()、pop()、filter()、map()...等
        $('.small').click(function (e) {
            $('#big').attr('src', e.target.src.replace('B', 'A'))
        })

    </script>
</body>

</html>
